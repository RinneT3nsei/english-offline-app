<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111318">
  <title>Offline English Vocabulary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 1. Upper Top App Bar (Material 3: scrolls naturally with page) -->
  <header class="top-app-bar">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          <path d="M9 7h6"></path>
          <path d="M9 11h6"></path>
        </svg>
      </div>
      <div class="brand-text">
        <h1 class="brand-title">Offline English</h1>
        <span class="brand-subtitle">Словник &amp; контекстні фрази</span>
      </div>
    </div>

    <!-- Quick Self-test Blur Toggle -->
    <button id="toggleAllBlurBtn" class="action-pill-btn" title="Режим тренування (приховати/показати всі переклади)">
      <svg class="eye-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
      <span id="blurModeLabel">Тренування</span>
    </button>
  </header>

  <!-- 2. Lower Sticky Control Bar (Material 3: permanently sticky with frosted glass blur) -->
  <div class="sticky-app-bar" id="stickyAppBar">
    <div class="sticky-inner">
      <!-- Live Search Bar -->
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="search" 
          id="searchInput" 
          placeholder="Пошук слів або перекладу..." 
          autocomplete="off" 
          spellcheck="false"
          enterkeyhint="search"
        >
        <button id="clearSearchBtn" class="clear-btn" aria-label="Очистити пошук" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- M3 Filter Chips with Favorites -->
      <div class="filter-chips" id="filterChips">
        <button class="chip chip-fav" data-pos="favorites">
          <span class="chip-star">⭐</span> Збережені <span class="chip-count" id="countFavs">0</span>
        </button>
        <button class="chip active" data-pos="all">
          Всі <span class="chip-count" id="countAll">0</span>
        </button>
        <button class="chip" data-pos="noun">Іменники</button>
        <button class="chip" data-pos="verb">Дієслова</button>
        <button class="chip" data-pos="adjective">Прикметники</button>
      </div>

      <!-- Minimalist Status & 100% Offline Badge -->
      <div class="status-bar">
        <span id="resultsCount">Завантаження...</span>
        <span class="offline-badge">
          <span class="dot"></span> 100% Offline
        </span>
      </div>
    </div>
  </div>

  <!-- Main Content Cards Area -->
  <main class="main-content">
    <div id="cardsList" class="cards-list">
      <!-- Cards rendered dynamically via JS -->
    </div>

    <div id="emptyState" class="empty-state" hidden>
      <div class="empty-icon">⭐</div>
      <p class="empty-title">Нічого не знайдено</p>
      <p class="empty-desc">Спробуйте змінити фільтри або позначте слова зірочкою</p>
      <button id="resetFilterBtn" class="reset-btn">Скинути фільтри</button>
    </div>
  </main>

  <!-- Local Offline ONNX Runtime Web for Piper Neural TTS -->
  <script src="assets/tts/ort.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
